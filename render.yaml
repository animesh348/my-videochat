# Render Blueprint — auto-applied when you "Deploy from Blueprint" or connect this repo.
# Docs: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: nextalk
    runtime: python
    plan: free                # upgrade to "starter" for no cold starts + persistent disk
    region: singapore         # closest to India; change if your audience is elsewhere
    branch: main

    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT

    healthCheckPath: /healthz

    envVars:
      # Pin Python version so deploys are reproducible.
      - key: PYTHON_VERSION
        value: "3.12.0"

      # Cloudflare Turnstile. Paste real values in Render dashboard → Environment.
      # sync:false means "secret, not committed to the blueprint".
      - key: TURNSTILE_SITE_KEY
        sync: false
      - key: TURNSTILE_SECRET
        sync: false

      # HMAC secret for CAPTCHA session tickets. generateValue:true means
      # Render auto-creates a strong random value on first deploy and stores it.
      - key: SESSION_SECRET
        generateValue: true

    # NOTE: persistent disks require a paid plan. On free, reports.jsonl and
    # bans.jsonl are wiped on every redeploy/restart. Uncomment when you upgrade:
    #
    # disk:
    #   name: data
    #   mountPath: /var/data
    #   sizeGB: 1
