services:
  - type: web
    name: nextalk
    runtime: python
    plan: free
    region: singapore
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: TURNSTILE_SITE_KEY
        sync: false
      - key: TURNSTILE_SECRET
        sync: false
